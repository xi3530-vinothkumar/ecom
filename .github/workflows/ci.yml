name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"   # weekly dependency scan against fresh NVD data
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.detect.outputs.full }}
      modules: ${{ steps.detect.outputs.modules }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            scripts/changed-modules.sh "origin/${{ github.base_ref }}" HEAD
          else
            # main / schedule / manual: always the full reactor
            echo "full=true" >> "$GITHUB_OUTPUT"; echo "modules=" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: github.event_name != 'schedule' && (needs.changes.outputs.full == 'true' || needs.changes.outputs.modules != '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven   # caches ~/.m2/repository keyed on pom.xml hashes
      - name: Full reactor build (unit + Testcontainers ITs)
        if: needs.changes.outputs.full == 'true'
        run: mvn -B -ntp verify
      - name: Changed modules + dependents
        if: needs.changes.outputs.full != 'true'
        env:
          MODULES: ${{ needs.changes.outputs.modules }}
        run: |
          # upstream (unchanged) modules are installed without tests so -amd can resolve them in a clean runner
          mvn -B -ntp -DskipTests install -pl "$MODULES" -am
          mvn -B -ntp verify -pl "$MODULES" -amd
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  security-scan:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: OWASP Dependency-Check (fails on CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -ntp -Psecurity-scan -DskipTests verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 14

  infra-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config
        working-directory: infra/docker-compose
        run: docker compose -f docker-compose.yml --profile core --profile services --profile observability config -q
      - name: Kustomize overlays
        run: for e in dev staging prod; do kubectl kustomize "infra/k8s/overlays/$e" > /dev/null && echo "$e ok"; done
      - name: Alert rules in sync (Compose <-> K8s)
        run: cmp infra/docker-compose/config/prometheus/alert-rules.yml infra/k8s/base/platform/prometheus-alert-rules.yml
      - name: Prometheus rules
        run: docker run --rm --entrypoint promtool -v "$PWD/infra/docker-compose/config/prometheus:/etc/prometheus:ro" prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
      - name: Shell scripts
        run: bash -n scripts/*.sh && shellcheck -S warning scripts/*.sh
