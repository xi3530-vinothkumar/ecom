spring:
  application:
    name: cart-service
  grpc:
    server:
      port: ${GRPC_PORT:9094}
    client:
      channel:
        catalog:
          target: ${CATALOG_GRPC_ADDRESS:localhost:9092}
          default:
            deadline: 2s
          keepalive:
            time: 30s
  cache:
    # Redis is on the classpath for carts; the catalog L1 cache is in-process
    type: caffeine
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
server:
  port: ${HTTP_PORT:8084}
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,redis
ecom:
  kafka:
    create-topics: ${KAFKA_CREATE_TOPICS:false}
  cart:
    guest-ttl: 30d
    max-quantity: 99
    max-lines: 100
    processed-event-ttl: 7d
    catalog-cache:
      ttl: 30s
      max-size: 10000
