spring:
  application:
    name: order-service
  grpc:
    server:
      port: ${GRPC_PORT:9095}
    client:
      channel:
        cart:
          target: ${CART_GRPC_ADDRESS:localhost:9094}
          default:
            deadline: 2s
          keepalive:
            time: 30s
        catalog:
          target: ${CATALOG_GRPC_ADDRESS:localhost:9092}
          default:
            deadline: 2s
          keepalive:
            time: 30s
        user:
          target: ${USER_GRPC_ADDRESS:localhost:9091}
          default:
            deadline: 2s
          keepalive:
            time: 30s
        payment:
          target: ${PAYMENT_GRPC_ADDRESS:localhost:9096}
          default:
            deadline: 2s
          keepalive:
            time: 30s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${DB_USERNAME:order}
    password: ${DB_PASSWORD:order}
server:
  port: ${HTTP_PORT:8085}
ecom:
  kafka:
    create-topics: ${KAFKA_CREATE_TOPICS:false}
  order:
    currency: EUR
    vat-rate: 0.21
    shipping-fee: 4.95
    pending-stale-after: 30m
    pending-stale-refresh: 60s
logging:
  level:
    # a unique violation on (user_id, idempotency_key) is the expected concurrent-replay path; SQL errors
    # still propagate as exceptions and are logged by whoever handles them
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
