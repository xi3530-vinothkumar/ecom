apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecom
labels:
  - pairs:
      app.kubernetes.io/name: gateway
      app.kubernetes.io/part-of: ecom
    includeSelectors: true
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - externalsecret.yaml
configMapGenerator:
  - name: gateway-config
    literals:
      - HTTP_PORT=8080
      - GRPC_PORT=9090
      - MANAGEMENT_SERVER_PORT=8081
      - KAFKA_CREATE_TOPICS=false
      - USER_SERVICE_URI=http://user-service:8080
      - CATALOG_SERVICE_URI=http://catalog-service:8080
      - INVENTORY_SERVICE_URI=http://inventory-service:8080
      - CART_SERVICE_URI=http://cart-service:8080
      - ORDER_SERVICE_URI=http://order-service:8080
      - PAYMENT_SERVICE_URI=http://payment-service:8080
      - SEARCH_SERVICE_URI=http://search-service:8080
      - USER_JWKS_URI=http://user-service:8080/.well-known/jwks.json
      - JWT_ISSUER=ecom-user-service
      - JWT_AUDIENCE=ecom
      - CORS_ALLOWED_ORIGINS=https://www.example.com
      - PSP_DEV_ROUTES_ENABLED=false
      # exactly one proxy (the ALB) in front: take the client IP from the last X-Forwarded-For hop
      - TRUSTED_PROXY_HOPS=1
