# Synced from AWS Secrets Manager (values set out-of-band). ENV in the key is replaced per overlay.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: search-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: search-service-secrets
    creationPolicy: Owner
  data:
    # bound directly by Spring Boot (spring.elasticsearch.api-key)
    - secretKey: SPRING_ELASTICSEARCH_API_KEY
      remoteRef:
        key: ecom/ENV/search/elasticsearch
        property: api_key
