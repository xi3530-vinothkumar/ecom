apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecom
labels:
  - pairs:
      app.kubernetes.io/name: notification-service
      app.kubernetes.io/part-of: ecom
    includeSelectors: true
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - externalsecret.yaml
configMapGenerator:
  - name: notification-service-config
    literals:
      - HTTP_PORT=8080
      - GRPC_PORT=9090
      - MANAGEMENT_SERVER_PORT=8081
      - KAFKA_CREATE_TOPICS=false
      - USER_GRPC_ADDRESS=user-service:9090
      - NOTIFICATION_CHANNEL=smtp
      - SMTP_PORT=587
      - MAIL_FROM=no-reply@example.com
