# Synced from AWS Secrets Manager (values set out-of-band). ENV in the key is replaced per overlay.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: notification-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: notification-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: ecom/ENV/notification/db
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: ecom/ENV/notification/db
        property: password
