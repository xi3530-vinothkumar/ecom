# NetworkPolicies for namespace `ecom` (PLAN §5/§10). Default deny, then explicit allows derived from the
# call graph in SERVICE_CONVENTIONS.md. This is what makes the Gateway-stamped X-User-* headers trustworthy:
# service HTTP ports (8080) accept traffic ONLY from gateway pods. gRPC (9090) only from the specific callers.
# CIDR placeholders here; each overlay patches them to its Terraform VPC (vpc_cidr 10.X.0.0/16):
#   10.X.0.0/18    public subnets (ALB ENIs)     10.X.160.0/19  data subnets (RDS, ElastiCache, MSK, Elastic Cloud PrivateLink)
#   10.X.0.0/16    VPC (interface endpoints: STS, Secrets Manager, ECR)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ecom
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: ecom
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Managed data stores (AWS, outside the cluster -> ipBlock): Postgres/RDS, Redis/ElastiCache,
# Kafka/MSK (IAM listener 9098), Elasticsearch via PrivateLink endpoint (HTTPS 443). Plus AWS APIs via VPC interface endpoints (STS for IRSA).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-data-stores
  namespace: ecom
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 10.0.48.0/20 }
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 9098 }
        - { protocol: TCP, port: 443 }
    - to:
        - ipBlock: { cidr: 10.0.0.0/16 }
      ports:
        - { protocol: TCP, port: 443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-otel-collector
  namespace: ecom
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ecom-observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - { protocol: TCP, port: 4317 }
        - { protocol: TCP, port: 4318 }
---
# Metrics scrape: only the OTel collector, only the management port (8081, actuator). Not the app port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-metrics-scrape
  namespace: ecom
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ecom-observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
      ports:
        - { protocol: TCP, port: 8081 }
---
# Edge: the ALB (IP targets from the public subnets) is the only source for gateway 8080 (+ 8081 health check).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress-from-alb
  namespace: ecom
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 10.0.0.0/20 }
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8081 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-egress-to-services-http
  namespace: ecom
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              ecom.io/tier: service
      ports:
        - { protocol: TCP, port: 8080 }
---
# THE header-trust rule: service HTTP ports accept ingress only from gateway pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: services-http-ingress-from-gateway-only
  namespace: ecom
spec:
  podSelector:
    matchLabels:
      ecom.io/tier: service
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - { protocol: TCP, port: 8080 }
---
