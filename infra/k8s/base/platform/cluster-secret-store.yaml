# External Secrets Operator -> AWS Secrets Manager. Authenticates with the ESO controller's own IRSA role
# (ecom-<env>-external-secrets, read-only on ecom/<env>/*), so app pods never hold Secrets Manager permissions.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
