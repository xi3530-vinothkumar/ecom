# Synced from AWS Secrets Manager (values set out-of-band). ENV in the key is replaced per overlay.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: payment-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: payment-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: ecom/ENV/payment/db
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: ecom/ENV/payment/db
        property: password
    - secretKey: PSP_API_KEY
      remoteRef:
        key: ecom/ENV/payment/psp
        property: api_key
    - secretKey: PSP_WEBHOOK_SECRET
      remoteRef:
        key: ecom/ENV/payment/psp
        property: webhook_secret
