apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecom
labels:
  - pairs:
      app.kubernetes.io/name: inventory-service
      app.kubernetes.io/part-of: ecom
    includeSelectors: true
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - externalsecret.yaml
configMapGenerator:
  - name: inventory-service-config
    literals:
      - HTTP_PORT=8080
      - GRPC_PORT=9090
      - MANAGEMENT_SERVER_PORT=8081
      - KAFKA_CREATE_TOPICS=false
      - RESERVATION_TTL=15m
      - RESERVATION_SWEEP_INTERVAL=60s
