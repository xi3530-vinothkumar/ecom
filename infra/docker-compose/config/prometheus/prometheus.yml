# Metrics arrive via remote write from the OTel collector (which scrapes the services),
# so Prometheus itself only scrapes itself and evaluates the alert rules.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alert-rules.yml
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
