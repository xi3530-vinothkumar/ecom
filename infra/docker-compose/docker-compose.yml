# Ecom local stack (PLAN §7). Profiles:
#   core          Postgres (6 DBs), Redis, Kafka (KRaft), Elasticsearch, Redpanda Console
#   services      Gateway + 8 services (images from scripts/build-images.sh); implies the core data stores
#   observability OTel Collector, Prometheus (+ alert rules), Grafana, Tempo, Loki, kafka-exporter
#
#   cp .env.example .env
#   docker compose --profile core up -d                          # run services from the IDE against it
#   docker compose --profile services --profile observability up -d   # everything
#
# Host ports: gateway 8080, postgres 5432, redis 6379, kafka 9092, elasticsearch 9200,
#             redpanda console 8090, grafana 3001, prometheus 9090, otel 4317/4318.
# Service ports are NOT published: like in EKS, the Gateway is the only way in.
name: ecom

x-service-env: &service-env
  HTTP_PORT: "8080"
  GRPC_PORT: "9090"
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  KAFKA_CREATE_TOPICS: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  TRACING_ENABLED: ${TRACING_ENABLED:-true}
  TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
  # Paketo memory calculator: fewer threads so the JVM fits the 768m container limit
  BPL_JVM_THREAD_COUNT: "50"
  JAVA_TOOL_OPTIONS: -XX:+ExitOnOutOfMemoryError

x-service: &service
  profiles: [services]
  restart: unless-stopped
  mem_limit: 768m
  volumes:
    - hc-tools:/hc:ro
  healthcheck:
    # Buildpack (tiny) images ship no shell/curl: use the static busybox copied in by hc-tools
    test: ["CMD", "/hc/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 60s

x-db-deps: &db-deps
  hc-tools: { condition: service_completed_successfully }
  postgres: { condition: service_healthy }
  kafka: { condition: service_healthy }

services:
  # ------------------------------------------------------------------ core
  postgres:
    image: postgres:16-alpine
    profiles: [core, services]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d notificationdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    profiles: [core, services]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    profiles: [core, services]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for containers (kafka:19092), EXTERNAL for the host / IDE (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics come from kafka-topics.yaml (KAFKA_CREATE_TOPICS=true)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    profiles: [core, services]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      bootstrap.memory_lock: "false"
    ports: ["9200:9200"]
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow\\&timeout=5s > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.2
    profiles: [core]
    environment:
      KAFKA_BROKERS: kafka:19092
    ports: ["8090:8080"]
    depends_on:
      kafka: { condition: service_healthy }

  # ------------------------------------------------------------------ services
  hc-tools:
    image: busybox:1.37-musl
    profiles: [services]
    command: ["cp", "/bin/busybox", "/hc/busybox"]
    volumes:
      - hc-tools:/hc

  user-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-ecom}/ecom-user-service:${IMAGE_TAG:-0.1.0-SNAPSHOT}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/userdb
      DB_USERNAME: user
      DB_PASSWORD: user
      JWT_EPHEMERAL_KEY: ${JWT_EPHEMERAL_KEY:-true}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM:-}
      JWT_KEY_ID: ${JWT_KEY_ID:-local-dev}
      JWT_ISSUER: ecom-user-service
      JWT_AUDIENCE: ecom
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ecom.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin-Passw0rd}
      CART_GRPC_ADDRESS: cart-service:9090
    depends_on: *db-deps

  catalog-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-ecom}/ecom-catalog-service:${IMAGE_TAG:-0.1.0-SNAPSHOT}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/catalogdb
      DB_USERNAME: catalog
      DB_PASSWORD: catalog
      IMAGES_ENABLED: "false"
    depends_on: *db-deps

  inventory-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-ecom}/ecom-inventory-service:${IMAGE_TAG:-0.1.0-SNAPSHOT}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/inventorydb
      DB_USERNAME: inventory
      DB_PASSWORD: inventory
      RESERVATION_TTL: 15m
      RESERVATION_SWEEP_INTERVAL: 60s
    depends_on: *db-deps

  cart-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-ecom}/ecom-cart-service:${IMAGE_TAG:-0.1.0-SNAPSHOT}
    environment:
      <<: *service-env
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CATALOG_GRPC_ADDRESS: catalog-service:9090
    depends_on:
      hc-tools: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }

  order-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-ecom}/ecom-order-service:${IMAGE_TAG:-0.1.0-SNAPSHOT}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
      DB_USERNAME: order
      DB_PASSWORD: order
      CART_GRPC_ADDRESS: cart-service:9090
      CATALOG_GRPC_ADDRESS: catalog-service:9090
      USER_GRPC_ADDRESS: user-service:9090
      PAYMENT_GRPC_ADDRESS: payment-service:9090
    depends_on: *db-deps

  payment-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-ecom}/ecom-payment-service:${IMAGE_TAG:-0.1.0-SNAPSHOT}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/paymentdb
      DB_USERNAME: payment
      DB_PASSWORD: payment
      PSP_MODE: ${PSP_MODE:-fake}
      PSP_WEBHOOK_SECRET: ${PSP_WEBHOOK_SECRET:-whsec_local_dev_secret}
      ORDER_GRPC_ADDRESS: order-service:9090
      INVENTORY_GRPC_ADDRESS: inventory-service:9090
    depends_on: *db-deps

  notification-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-ecom}/ecom-notification-service:${IMAGE_TAG:-0.1.0-SNAPSHOT}
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/notificationdb
      DB_USERNAME: notification
      DB_PASSWORD: notification
      USER_GRPC_ADDRESS: user-service:9090
      NOTIFICATION_CHANNEL: log
    depends_on: *db-deps

  search-service:
    <<: *service
    image: ${IMAGE_REGISTRY:-ecom}/ecom-search-service:${IMAGE_TAG:-0.1.0-SNAPSHOT}
    environment:
      <<: *service-env
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      hc-tools: { condition: service_completed_successfully }
      elasticsearch: { condition: service_healthy }
      kafka: { condition: service_healthy }

  gateway:
    <<: *service
    image: ${IMAGE_REGISTRY:-ecom}/ecom-gateway:${IMAGE_TAG:-0.1.0-SNAPSHOT}
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    environment:
      <<: *service-env
      USER_SERVICE_URI: http://user-service:8080
      CATALOG_SERVICE_URI: http://catalog-service:8080
      INVENTORY_SERVICE_URI: http://inventory-service:8080
      CART_SERVICE_URI: http://cart-service:8080
      ORDER_SERVICE_URI: http://order-service:8080
      PAYMENT_SERVICE_URI: http://payment-service:8080
      SEARCH_SERVICE_URI: http://search-service:8080
      USER_JWKS_URI: http://user-service:8080/.well-known/jwks.json
      JWT_ISSUER: ecom-user-service
      JWT_AUDIENCE: ecom
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PSP_DEV_ROUTES_ENABLED: "true"
      TRUSTED_PROXY_HOPS: "0"   # no proxy in front of the gateway locally
    depends_on:
      hc-tools: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      user-service: { condition: service_healthy }
      catalog-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
      cart-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      search-service: { condition: service_healthy }

  # ------------------------------------------------------------------ observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    profiles: [observability]
    user: "0"   # needs to read /var/lib/docker/containers/*/*.log
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otel-filelog:/var/lib/otelcol/file_storage
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      prometheus: { condition: service_started }
      tempo: { condition: service_started }
      loki: { condition: service_started }

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    profiles: [observability]
    command: ["--kafka.server=kafka:19092", "--topic.filter=^ecom\\..*"]
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy, required: false }

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
    ports: ["9090:9090"]

  tempo:
    image: grafana/tempo:2.6.1
    profiles: [observability]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./config/tempo/tempo.yaml:/etc/tempo.yaml:ro

  loki:
    image: grafana/loki:3.3.2
    profiles: [observability]
    command: ["-config.file=/etc/loki/local-config.yaml"]

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    depends_on:
      prometheus: { condition: service_started }
      tempo: { condition: service_started }
      loki: { condition: service_started }

volumes:
  pgdata:
  kafkadata:
  esdata:
  hc-tools:
  otel-filelog:
