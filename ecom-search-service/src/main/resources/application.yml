spring:
  application:
    name: search-service
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}
    connection-timeout: 5s
    socket-timeout: 30s
    # api-key: unset locally / in Compose (security disabled); in AWS envs SPRING_ELASTICSEARCH_API_KEY
    # (Elastic Cloud API key, base64 id:key) comes from the search-service-secrets ExternalSecret
  kafka:
    consumer:
      properties:
        # same partition numbers of all catalog topics go to the same consumer, so one product's
        # created/updated/deleted events are handled by one thread
        partition.assignment.strategy: org.apache.kafka.clients.consumer.RangeAssignor
server:
  port: ${HTTP_PORT:8088}
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,elasticsearch
ecom:
  kafka:
    create-topics: ${KAFKA_CREATE_TOPICS:false}
  search:
    index: products
    orphan-ttl: 24h
    purge-cron: "0 17 3 * * *"
