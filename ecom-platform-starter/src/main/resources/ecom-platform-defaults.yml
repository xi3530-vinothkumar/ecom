# Platform-wide defaults (lowest precedence). Env vars / service application.yml override.
server:
  shutdown: graceful
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jackson:
    deserialization:
      fail-on-unknown-properties: false   # additive-only event/DTO evolution
      fail-on-null-for-primitives: false  # Jackson 3 flipped this default; keep Jackson 2 behaviour
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/platform
  cloud:
    circuitbreaker:
      # run on the caller thread (no thread-pool bulkhead / time limiter): keeps CallContext/MDC
      # and leaves timeouts to the gRPC deadlines
      bulkhead:
        resilience4j:
          enabled: false
      resilience4j:
        disable-thread-pool: true
        disable-time-limiter: true
  grpc:
    server:
      shutdown:
        grace-period: 15s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      observation-enabled: true
    template:
      # outbox relay sets traceparent itself (captured at write time) - do not overwrite it
      observation-enabled: false
logging:
  structured:
    json:
      add:
        service: ${spring.application.name:unknown}
      customizer: com.ecom.platform.observability.PiiMaskingJsonMembersCustomizer
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      # services without a DB (gateway, cart, search) simply lack the db contributor
      validate-group-membership: false
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    export:
      enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  observations:
    key-values:
      service: ${spring.application.name:unknown}
  otlp:
    metrics:
      export:
        # metrics are scraped via /actuator/prometheus; OTLP is for traces only
        enabled: false
  metrics:
    tags:
      service: ${spring.application.name:unknown}
